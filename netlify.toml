[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/portfolio"
  to = "/work"
  status = 301

[[redirects]]
  from = "/portfolio/*"
  to = "/work/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
